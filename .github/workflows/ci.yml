name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Test all packages
        # mint/sdk/mppx suites already run serially (PGlite memory)
        run: npm test
